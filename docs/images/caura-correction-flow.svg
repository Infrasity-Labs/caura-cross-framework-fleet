<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title desc">
  <title id="title">How one correction reaches every framework</title>
  <desc id="desc">Five steps. The Researcher stores three facts, the Writer drafts with them, the Reviewer retires the 100 requests per minute limit and stores 60, then the Researcher and the Editor both use 60.</desc>
  <rect width="1000" height="600" fill="#08070b"/>
  <text x="40" y="52" fill="#fff" font-family="Georgia, serif" font-size="30" font-weight="700">How one correction reaches every framework</text>
  <text x="40" y="82" fill="#ddd6e8" font-family="Arial, sans-serif" font-size="16">Each column shows what the agent did, then what team memory holds afterwards.</text>

  <g fill="#14111b" stroke="#ff7a22" stroke-width="3">
    <rect x="20" y="110" width="180" height="130" rx="14"/>
    <rect x="215" y="110" width="180" height="130" rx="14"/>
    <rect x="410" y="110" width="180" height="130" rx="14"/>
    <rect x="605" y="110" width="180" height="130" rx="14"/>
    <rect x="800" y="110" width="180" height="130" rx="14" stroke="#9d6cff"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#ff9a51" font-size="14" font-weight="700" letter-spacing="3">
      <text x="110" y="138">STEP 1</text>
      <text x="305" y="138">STEP 2</text>
      <text x="500" y="138">STEP 3</text>
      <text x="695" y="138">STEP 4</text>
      <text x="890" y="138" fill="#b99bff">STEP 5</text>
    </g>
    <g fill="#fff" font-size="20" font-weight="700">
      <text x="110" y="168">Researcher</text>
      <text x="305" y="168">Writer</text>
      <text x="500" y="168">Reviewer</text>
      <text x="695" y="168">Researcher</text>
      <text x="890" y="168">Editor</text>
    </g>
    <g fill="#ddd6e8" font-size="13">
      <text x="110" y="190">OpenAI Agents SDK</text>
      <text x="305" y="190">CrewAI</text>
      <text x="500" y="190">LangGraph</text>
      <text x="695" y="190">OpenAI Agents SDK</text>
      <text x="890" y="190">LangGraph + Rail</text>
    </g>
    <g fill="#fff" font-size="14">
      <text x="110" y="220">stores 3 facts</text>
      <text x="305" y="220">drafts with 100</text>
      <text x="500" y="220">retires 100, writes 60</text>
      <text x="695" y="220">answers 60</text>
      <text x="890" y="220">announces 60</text>
    </g>
  </g>
  <g fill="#ddd6e8">
    <path d="M203 168 l9 7 l-9 7 z"/>
    <path d="M398 168 l9 7 l-9 7 z"/>
    <path d="M593 168 l9 7 l-9 7 z"/>
    <path d="M788 168 l9 7 l-9 7 z"/>
  </g>

  <g fill="#0e0b14" stroke="#2a2533" stroke-width="2">
    <rect x="20" y="265" width="180" height="230" rx="14"/>
    <rect x="215" y="265" width="180" height="230" rx="14"/>
    <rect x="410" y="265" width="180" height="230" rx="14"/>
    <rect x="605" y="265" width="180" height="230" rx="14"/>
    <rect x="800" y="265" width="180" height="230" rx="14"/>
  </g>
  <g fill="#8a8296" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">
    <text x="110" y="290">TEAM MEMORY</text>
    <text x="305" y="290">TEAM MEMORY</text>
    <text x="500" y="290">TEAM MEMORY</text>
    <text x="695" y="290">TEAM MEMORY</text>
    <text x="890" y="290">TEAM MEMORY</text>
  </g>

  <!-- chips: active = teal, outdated = grey struck through, new = orange -->
  <g font-family="Arial, sans-serif" font-size="14" text-anchor="middle" stroke-width="2">
    <!-- step 1 -->
    <rect x="35" y="305" width="150" height="34" rx="17" fill="#0f2522" stroke="#56d4c5"/><text x="110" y="327" fill="#fff">100 req / min</text>
    <rect x="35" y="349" width="150" height="34" rx="17" fill="#0f2522" stroke="#56d4c5"/><text x="110" y="371" fill="#fff">5 min cache</text>
    <rect x="35" y="393" width="150" height="34" rx="17" fill="#0f2522" stroke="#56d4c5"/><text x="110" y="415" fill="#fff">10k calls / month</text>
    <!-- step 2 -->
    <rect x="230" y="305" width="150" height="34" rx="17" fill="#0f2522" stroke="#56d4c5"/><text x="305" y="327" fill="#fff">100 req / min</text>
    <rect x="230" y="349" width="150" height="34" rx="17" fill="#0f2522" stroke="#56d4c5"/><text x="305" y="371" fill="#fff">5 min cache</text>
    <rect x="230" y="393" width="150" height="34" rx="17" fill="#0f2522" stroke="#56d4c5"/><text x="305" y="415" fill="#fff">10k calls / month</text>
    <!-- step 3 -->
    <rect x="425" y="305" width="150" height="34" rx="17" fill="#15121a" stroke="#4a4455"/><text x="500" y="327" fill="#8a8296">100 req / min</text>
    <path d="M455 322 H545" stroke="#e5484d"/>
    <rect x="425" y="349" width="150" height="34" rx="17" fill="#0f2522" stroke="#56d4c5"/><text x="500" y="371" fill="#fff">5 min cache</text>
    <rect x="425" y="393" width="150" height="34" rx="17" fill="#0f2522" stroke="#56d4c5"/><text x="500" y="415" fill="#fff">10k calls / month</text>
    <rect x="425" y="437" width="150" height="34" rx="17" fill="#2a1606" stroke="#ff8a34"/><text x="500" y="459" fill="#fff" font-weight="700">60 req / min</text>
    <!-- step 4 -->
    <rect x="620" y="305" width="150" height="34" rx="17" fill="#15121a" stroke="#4a4455"/><text x="695" y="327" fill="#8a8296">100 req / min</text>
    <path d="M650 322 H740" stroke="#e5484d"/>
    <rect x="620" y="349" width="150" height="34" rx="17" fill="#0f2522" stroke="#56d4c5"/><text x="695" y="371" fill="#fff">5 min cache</text>
    <rect x="620" y="393" width="150" height="34" rx="17" fill="#0f2522" stroke="#56d4c5"/><text x="695" y="415" fill="#fff">10k calls / month</text>
    <rect x="620" y="437" width="150" height="34" rx="17" fill="#0f2522" stroke="#56d4c5"/><text x="695" y="459" fill="#fff" font-weight="700">60 req / min</text>
    <!-- step 5 -->
    <rect x="815" y="305" width="150" height="34" rx="17" fill="#15121a" stroke="#4a4455"/><text x="890" y="327" fill="#8a8296">100 req / min</text>
    <path d="M845 322 H935" stroke="#e5484d"/>
    <rect x="815" y="349" width="150" height="34" rx="17" fill="#0f2522" stroke="#56d4c5"/><text x="890" y="371" fill="#fff">5 min cache</text>
    <rect x="815" y="393" width="150" height="34" rx="17" fill="#0f2522" stroke="#56d4c5"/><text x="890" y="415" fill="#fff">10k calls / month</text>
    <rect x="815" y="437" width="150" height="34" rx="17" fill="#0f2522" stroke="#56d4c5"/><text x="890" y="459" fill="#fff" font-weight="700">60 req / min</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#ddd6e8">
    <rect x="40" y="530" width="28" height="18" rx="9" fill="#0f2522" stroke="#56d4c5" stroke-width="2"/><text x="78" y="544">active, returned by recall</text>
    <rect x="300" y="530" width="28" height="18" rx="9" fill="#2a1606" stroke="#ff8a34" stroke-width="2"/><text x="338" y="544">written in this step</text>
    <rect x="530" y="530" width="28" height="18" rx="9" fill="#15121a" stroke="#4a4455" stroke-width="2"/><path d="M533 539 H555" stroke="#e5484d" stroke-width="2"/><text x="568" y="544">outdated, hidden from every agent's recall</text>
  </g>
</svg>
